syntax = "proto3";
package proto;
option go_package = "iron-bank/proto";

message BloomFilter {
    repeated  bool bitSet = 1;
    int64 size = 2;
}

message IndexEntry {
    string key = 1;
    int64 offset = 2;
}

message Index {
    repeated IndexEntry entries = 1;
}

message LSMEntry {
    string key = 1;
    Command command = 2;
    optional bytes value = 3;
    int64 timestamp = 4;
}

enum Command {
  PUT = 0;
  DELETE = 1;
  WRITE_SST = 2;
}

message KVPair {
    string Key = 1;
    string Value = 2;
    Command command = 3;
}

message WALEntry {      
    string key = 1;
    optional bytes value = 2;
    uint32  CRC = 3;
    Command command = 4;
}

message RaftLog {
    uint64 Term = 1;
    uint64 LogIndex = 2;
    KVPair Entries = 3; 
}

message AppendEntriesArgs {
    uint64 Term = 1;         
    uint64 LeaderID = 2;    
    uint64 PrevLogIndex = 3;     
    uint64 PrevLogTerm = 4;
    uint64 LeaderCommit = 5;  
    repeated KVPair Entries = 6;  
}

message AppendEntriesReply {
    uint64 Term = 1;
    uint64 ConflictIndex = 2;
    uint64 ConflictTerm = 3;
    bool Success = 4;
}

message RequestVoteArgs {
    uint64 Term = 1;
    uint64 CandidateID = 2;
    uint64 LastLogIndex = 3;
    uint64 LastLogTerm = 4;
}

message RequestVoteReply {
    uint64 Term = 1;
    bool VoteGranted = 2;
}

message RaftState {
    uint64 Term = 1;
    int64 VoteFor = 2;
}