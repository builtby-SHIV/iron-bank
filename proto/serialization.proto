syntax = "proto3";
package proto;
option go_package = "iron-bank/proto";

message BloomFilter {
    repeated  bool bitSet = 1;
    int64 size = 2;
}

message IndexEntry {
    string key = 1;
    int64 offset = 2;
}

message Index {
    repeated IndexEntry entries = 1;
}

message LSMEntry {
    string key = 1;
    Command command = 2;
    optional bytes value = 3;
    int64 timestamp = 4;
}

enum Command {
  PUT = 0;
  DELETE = 1;
  WRITE_SST = 2;
}

message LogEntry {
    uint64 Index = 1;
    string key = 4;
    optional bytes value = 5;
    uint32  CRC = 6;
    Command command = 7;
}

message AppendEntriesArgs {
    uint64 Term = 1;         
    uint64 LeaderID = 2;    
    uint64 PrevLogIndex = 3;     
    uint64 PrevLogTerm = 4;
    uint64 LeaderCommit = 5;  
    repeated LogEntry Entries = 6;  
}

message AppendEntriesReply {
    uint64 Term = 1;
    uint64 ConflictIndex = 2;
    uint64 ConflictTerm = 3;
    bool Success = 4;
}