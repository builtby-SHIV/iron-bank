syntax = "proto3";
option go_package = "./;main";

message BloomFilter {
    repeated  bool bitSet = 1;
    int64 size = 2;
}

message IndexEntry {
    string key = 1;
    int64 offset = 2;
}

message Index {
    repeated IndexEntry entries = 1;
}

message LSMEntry {
    string key = 1;
    Command command = 2;
    optional bytes value = 3;
    int64 timestamp = 4;
}

enum Command {
  PUT = 0;
  DELETE = 1;
  WRITE_SST = 2;
}

message LogEntry {
    uint64 Index = 1;
    uint64 Term = 2;
    uint64 VotedFor = 3;
    string key = 4;
    optional bytes value = 5;
    uint32  CRC = 6;
    Command command = 7;
}