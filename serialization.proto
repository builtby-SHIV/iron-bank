syntax = "proto3";
option go_package = "./;main";

message BloomFilter {
    repeated  bool bitSet = 1;
    int64 size = 2;
}

message IndexEntry {
    string key = 1;
    int64 offset = 2;
}

message Index {
    repeated IndexEntry entries = 1;
}

message LSMEntry {
    string key = 1;
    Command command = 2;
    optional bytes value = 3;
    int64 timestamp = 4;
}

enum Command {
  PUT = 0;
  DELETE = 1;
  WRITE_SST = 2;
}

message WAL_Entry {
    uint64   logSequenceNumber = 1;
    string key = 2;
    optional bytes value = 3;
    uint32  CRC = 4;
    Command command = 5;
}